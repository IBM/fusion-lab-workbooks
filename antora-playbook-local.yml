site:
  title: IBM Fusion Lab Guides
  start_page: fusion-lab-guides::index.adoc
asciidoc:
  attributes:
    experimental: ''
content:
  sources:
    - url: .
      branches: HEAD
      worktrees: true
ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
  supplemental_files: ./supplemental-ui
output:
  dir: ./.build/site

